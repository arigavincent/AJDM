<!doctype html><html><head><style>
  html,body{margin:0;width:1800px;height:640px;overflow:hidden}
  body{background:radial-gradient(900px 520px at 78% 18%,rgba(94,91,255,.45),transparent 60%),
       radial-gradient(700px 480px at 98% 100%,rgba(20,200,232,.35),transparent 60%),
       radial-gradient(600px 600px at 0% 0%,rgba(155,107,255,.28),transparent 60%),#100D2B;
       font-family:"Montserrat","Poppins","Inter","Segoe UI","Noto Sans",sans-serif;color:#fff}
  .photo{position:absolute;left:70px;top:64px;width:500px;height:504px;border-radius:54px;overflow:hidden;
         box-shadow:0 0 0 7px #FFC857,0 24px 60px rgba(0,0,0,.45)}
  .photo img{width:100%;height:100%;object-fit:cover;display:block}
  .badge{position:absolute;left:478px;top:476px;width:132px;height:132px;filter:drop-shadow(0 10px 18px rgba(0,0,0,.45))}
  .brand{position:absolute;left:700px;top:118px}
  .row{display:flex;align-items:center;gap:34px}
  .row img{width:170px;height:170px}
  .word{font-size:190px;font-weight:800;letter-spacing:14px;line-height:1;
        background:linear-gradient(100deg,#FFFFFF 0%,#E4E2FF 45%,#8EE7F5 100%);-webkit-background-clip:text;color:transparent}
  .rule{margin:44px 0 30px 4px;width:780px;height:9px;border-radius:9px;background:linear-gradient(90deg,#FFC857,#FF9F6E)}
  .tag{font-size:58px;font-style:italic;font-weight:500;color:#FFC857;letter-spacing:1px}
</style></head><body>
  <div class="photo"><img src="photo.png"></div>
  <img class="badge" src="ajdm-mark.svg">
  <div class="brand">
    <div class="row"><img src="ajdm-mark.svg"><div class="word">AJDM</div></div>
    <div class="rule"></div>
    <div class="tag">My brother. My legacy.</div>
  </div>
</body></html>
