<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>AJDM</title>
<style>
  :root{--ink:#14122B;--ink2:#221C4E;--iris:#5E5BFF;--violet:#9B6BFF;--cyan:#14C8E8;--amber:#FFC857;--muted:#6B6A86;--line:#E3E2F2}
  *{box-sizing:border-box} body{margin:0;width:340px;font:13px system-ui,"Segoe UI",sans-serif;color:#1B1838;background:#fff}
  header{display:flex;align-items:center;gap:10px;padding:12px 14px;color:#fff;
         background:linear-gradient(110deg,var(--ink),var(--ink2) 60%,#1B2A57);border-bottom:3px solid transparent;
         border-image:linear-gradient(90deg,var(--violet),var(--iris),var(--cyan)) 1}
  header img{width:30px;height:30px} header b{font-size:18px;letter-spacing:.5px;flex:1}
  .pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:12px;background:#2A2650;color:#CFCDF2}
  .pill.on{background:rgba(74,222,128,.18);color:#4ADE80}.pill.off{background:rgba(255,107,107,.18);color:#FF8A8A}
  .row{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line)}
  .row small{display:block;color:var(--muted);margin-top:2px}
  .switch{position:relative;width:42px;height:24px;flex:none}
  .switch input{opacity:0;width:0;height:0}
  .slider{position:absolute;inset:0;border-radius:24px;background:#CFCDE6;transition:.2s;cursor:pointer}
  .slider:before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
  input:checked+.slider{background:linear-gradient(90deg,var(--violet),var(--iris))}
  input:checked+.slider:before{transform:translateX(18px)}
  h2{font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);margin:12px 14px 6px}
  #media{max-height:240px;overflow:auto;padding:0 8px 6px}
  .item{display:flex;justify-content:space-between;gap:10px;padding:8px 8px;border-radius:8px;cursor:pointer}
  .item:hover{background:#ECEBFF}.item b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.item span{color:var(--muted);white-space:nowrap}
  .note{color:var(--muted);padding:6px 8px 10px}
  footer{display:flex;gap:14px;justify-content:space-between;padding:10px 14px;border-top:1px solid var(--line);background:#FAFAFE}
  footer a{color:var(--iris);text-decoration:none;cursor:pointer;font-weight:600}
</style></head>
<body>
  <header><img src="icons/ajdm-32.png" alt=""><b>AJDM</b><span id="status" class="pill">Checking…</span></header>
  <label class="row"><span>Take over browser downloads<small id="captureNote">Downloads you start open in AJDM.</small></span>
    <span class="switch"><input type="checkbox" id="capture"><span class="slider"></span></span></label>
  <h2>On this page</h2>
  <div id="media"><div class="note">Looking for videos…</div></div>
  <footer><a id="settings">Settings</a><a id="privacy">Privacy</a></footer>
  <script type="module" src="popup.js"></script>
</body></html>
